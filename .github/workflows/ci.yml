name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Switch to tinyland-nix when ARC runners are deployed
env:
  NIX_RUNNER: ubuntu-latest

jobs:
  lint:
    name: Lint Nix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: statix
        run: nix run nixpkgs#statix -- check . --ignore vendor/

      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail --exclude vendor/ .

      - name: nixfmt
        run: find . -name '*.nix' -not -path './vendor/*' -exec nix run nixpkgs#nixfmt-rfc-style -- --check {} +

  test:
    name: Property-Based Tests
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Run PBT suite
        run: nix develop --command python -m pytest tests/ -v --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  check:
    name: Flake Check
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Attic cache
        continue-on-error: true
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ vars.ATTIC_SERVER }}
          cache: main
          token: ${{ secrets.ATTIC_TOKEN }}
          skip-push: true

      - name: Flake check
        run: nix flake check --print-build-logs

  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Attic cache
        continue-on-error: true
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ vars.ATTIC_SERVER }}
          cache: main
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build tesmart-ctl
        run: nix build .#packages.x86_64-linux.tesmart-ctl --print-build-logs

  build-image:
    name: Build SD Image (native ARM64)
    runs-on: ubuntu-24.04-arm
    needs: lint
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Attic cache
        continue-on-error: true
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ vars.ATTIC_SERVER }}
          cache: main
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build serial-console SD image
        run: |
          nix build .#images.serial-console \
            --print-build-logs \
            --out-link result-image

      - name: Report image size
        run: |
          image=$(find result-image/ -name '*.img*' | head -1)
          echo "Image: ${image}"
          ls -lh "${image}"

      - name: Upload SD image artifact
        uses: actions/upload-artifact@v4
        with:
          name: serial-console-sd-image
          path: result-image/sd-image/*.img*
          retention-days: 7
          compression-level: 0
