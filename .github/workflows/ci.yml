name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# Switch to tinyland-nix when ARC runners are deployed
env:
  NIX_RUNNER: ubuntu-latest

jobs:
  lint:
    name: Lint Nix
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: statix
        run: nix run nixpkgs#statix -- check . --ignore vendor/

      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail --exclude vendor/ .

      - name: nixfmt
        run: find . -name '*.nix' -not -path './vendor/*' -exec nix run nixpkgs#nixfmt-rfc-style -- --check {} +

  check:
    name: Flake Check
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-platforms = aarch64-linux

      - name: Setup QEMU for aarch64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configure Attic cache
        continue-on-error: true
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ vars.ATTIC_SERVER }}
          cache: main
          token: ${{ secrets.ATTIC_TOKEN }}
          skip-push: true

      - name: Flake check
        run: nix flake check --print-build-logs

  build-packages:
    name: Build Packages
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main

      - name: Configure Attic cache
        continue-on-error: true
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ vars.ATTIC_SERVER }}
          cache: main
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build tesmart-ctl
        run: nix build .#packages.x86_64-linux.tesmart-ctl --print-build-logs

  build-image:
    name: Build SD Image
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Nix
        uses: DeterminateSystems/nix-installer-action@main
        with:
          extra-conf: |
            extra-platforms = aarch64-linux

      - name: Setup QEMU for aarch64
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Configure Attic cache
        continue-on-error: true
        uses: ryanccn/attic-action@v0
        with:
          endpoint: ${{ vars.ATTIC_SERVER }}
          cache: main
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build serial-console SD image
        run: |
          nix build .#images.serial-console \
            --print-build-logs \
            --out-link result-image

      - name: Report image size
        run: |
          image=$(find result-image/ -name '*.img*' | head -1)
          echo "Image: ${image}"
          ls -lh "${image}"
