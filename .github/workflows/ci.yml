name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint Nix
    runs-on: tinyland-nix
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/ensure-nix
        with:
          self_hosted: ${{ runner.environment != 'github-hosted' }}

      - name: statix
        run: nix run nixpkgs#statix -- check . --ignore vendor/

      - name: deadnix
        run: nix run nixpkgs#deadnix -- --fail --exclude vendor/ .

      - name: nixfmt
        run: find . -name '*.nix' -not -path './vendor/*' -exec nix run nixpkgs#nixfmt-rfc-style -- --check {} +

  test:
    name: Property-Based Tests
    runs-on: tinyland-nix
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/ensure-nix
        with:
          self_hosted: ${{ runner.environment != 'github-hosted' }}

      - name: Run PBT suite
        run: nix develop --command python -m pytest tests/ -v --junit-xml=test-results.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

  check:
    name: Flake Check
    runs-on: tinyland-nix
    needs: lint
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/ensure-nix
        with:
          self_hosted: ${{ runner.environment != 'github-hosted' }}

      - name: Flake checks (x86_64-linux, skip deploy checks that need aarch64)
        run: |
          nix build .#checks.x86_64-linux.pbt-tesmart-protocol --print-build-logs
          nix build .#checks.x86_64-linux.shellcheck-scripts --print-build-logs
          nix build .#checks.x86_64-linux.tesmart-ctl-build --print-build-logs

  build-packages:
    name: Build Packages
    runs-on: tinyland-nix
    needs: lint
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/ensure-nix
        with:
          self_hosted: ${{ runner.environment != 'github-hosted' }}

      - name: Build tesmart-ctl
        run: nix build .#packages.x86_64-linux.tesmart-ctl --print-build-logs

  build-image:
    name: Build SD Image
    runs-on: tinyland-nix
    needs: lint
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - uses: ./.github/actions/ensure-nix
        with:
          self_hosted: ${{ runner.environment != 'github-hosted' }}

      - name: Setup QEMU for aarch64
        run: |
          if ! nix run nixpkgs#qemu -- --version >/dev/null 2>&1; then
            echo "::notice::QEMU not pre-installed, using binfmt"
          fi
          # Ensure binfmt_misc is registered for aarch64
          if [ ! -f /proc/sys/fs/binfmt_misc/qemu-aarch64 ]; then
            sudo mkdir -p /proc/sys/fs/binfmt_misc
            sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
          fi

      - name: Configure extra-platforms
        run: |
          echo "extra-platforms = aarch64-linux" | sudo tee -a /etc/nix/nix.conf
          sudo systemctl restart nix-daemon 2>/dev/null || sudo pkill -HUP nix-daemon || true
          sleep 2

      - name: Build serial-console SD image
        run: |
          nix build .#images.serial-console \
            --print-build-logs \
            --out-link result-image

      - name: Report image size
        run: |
          image=$(find result-image/ -name '*.img*' | head -1)
          echo "Image: ${image}"
          ls -lh "${image}"

      - name: Upload SD image artifact
        uses: actions/upload-artifact@v4
        with:
          name: serial-console-sd-image
          path: result-image/sd-image/*.img*
          retention-days: 7
          compression-level: 0
