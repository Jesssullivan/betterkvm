# PiKVM secrets — encrypt with: sops -e -i secrets/pikvm.yaml
# Decrypt at flash time: sops -d --extract '["key"]' secrets/pikvm.yaml
#
# IMPORTANT: This file must be sops-encrypted before committing.
# Run `sops secrets/pikvm.yaml` to edit in-place with encryption.

# Reusable Tailscale auth key (generate from https://login.tailscale.com/admin/settings/keys)
tailscale_authkey: "tskey-auth-REPLACE_WITH_YOUR_KEY"

# Root password hash (generate with: mkpasswd -m sha-512)
pikvm_root_password_hash: "$6$REPLACE_WITH_HASH"

# kvmd web UI admin password (plaintext, used by kvmd-htpasswd)
kvmd_admin_password: "REPLACE_WITH_PASSWORD"
